name: jungle-wagering

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:?Set DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:?Set TEST_DB_NAME}
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:?Set TEST_DB_PORT}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Emulador SQS. As filas são criadas pelo script de init montado abaixo, para
  # que subir o Compose já entregue o broker no estado que a aplicação espera.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${SQS_PORT:-4566}:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  localstack-test:
    image: localstack/localstack:3.8
    profiles: [test]
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${TEST_SQS_PORT:-4567}:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:
  postgres-test-data:
